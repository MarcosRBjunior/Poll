services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poll
      POSTGRES_PASSWORD: poll
      POSTGRES_DB: poll
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
