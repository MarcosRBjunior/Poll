services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poll
      POSTGRES_PASSWORD: poll
      POSTGRES_DB: poll
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
